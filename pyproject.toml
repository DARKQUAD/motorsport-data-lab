[project]
name = "motorsport-data-lab"
version = "0.1.0"
description = "Race-engineering data science on real timing data: GT3 at the Nürburgring 24h / Le Mans, and French rallycross."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Romain Dupuy--Martrenchard" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<2.4",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.20"]
ml = [
    "autogluon.timeseries>=1.6,<1.7",
    "autogluon.tabular[lightgbm,catboost]>=1.6,<1.7",
    "chronos-forecasting>=2.3,<2.4",
]

[project.scripts]
mlab = "motorsport_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motorsport_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]


[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["app/"]

[[tool.mypy.overrides]]
module = ["motorsport_lab.ml.*"]
disallow_untyped_calls = false

[tool.pylint.main]
# chronos / autogluon / torch are an optional extra ([ml]): they are imported inside the
# functions that need them so the core package and the app start without them.
disable = ["import-outside-toplevel"]
# not installed in CI (optional [ml] extra)
ignored-modules = ["autogluon", "chronos"]

[tool.pylint.design]
# numeric code: simulators and PDF parsers keep their state in local arrays on purpose,
# and parameter dataclasses have one field per model knob.
max-locals = 40
max-args = 7
max-positional-arguments = 7
max-attributes = 15

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
